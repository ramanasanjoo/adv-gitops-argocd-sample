apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: adv-nonprod
  namespace: argocd
spec:
  sourceRepos: "https://github.com/ramanasanjoo/adv-gitops-argocd-sample.git"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "client-*-sh-*"
    - server: <ARGOCD_CLUSTER_SERVER_NONPROD_2>
      namespace: "client-*-ma-*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
