apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: adv-prod
  namespace: argocd
spec:
   sourceRepos: 
    - "https://github.com/ramanasanjoo/adv-gitops-argocd-sample.git"
  destinations:
    - server: <ARGOCD_CLUSTER_SERVER_PROD>
      namespace: "client-*-prod"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
